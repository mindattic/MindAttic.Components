<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAttic.UiUx — PageScrollbar demo</title>
  <link rel="stylesheet" href="page-scrollbar.css">
  <script src="page-scrollbar.js" defer></script>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: 'Outfit', system-ui, sans-serif;
           margin: 0; padding: 40px; }
    section { max-width: 720px; margin: 0 auto; }
    .block { height: 70vh; margin: 24px 0; border: 1px solid #30363d; border-radius: 10px;
             display: flex; align-items: center; justify-content: center; background: #161b22; }
  </style>
</head>
<body>
  <section>
    <h1>PageScrollbar</h1>
    <p>The native scrollbar is hidden and replaced by the themed overlay on the
       right. Drag the thumb, or click the track to page toward that point.</p>
    <div class="block">Scroll down…</div>
    <div class="block">…the thumb shrinks as content grows…</div>
    <div class="block">…and tracks your scroll position.</div>
    <div class="block">End.</div>
  </section>
</body>
</html>
