name: Splice MindAttic.Components into MindAttic.Psst

# ====================================================================
# Rebuilds MindAttic.Psst's privacy.htm and terms.htm (the inline Outfit
# font block, OUTFITFONT) with web/build/build-sites.mjs and opens a pull
# request there. Cross-repo access needs the SUBSCRIBER_REPO_TOKEN secret
# in this repo (a token with write access to MindAttic.Psst).
#
# Replaces MindAttic.Web's sync-subscribers.yml, which ran the retired
# MindAttic.Web.Shared sync script. The sites in MindAttic.Web are built by
# MindAttic.Deploy's linked deploy instead; Tutor is built locally.
# ====================================================================

on:
  push:
    branches: [main]
    paths:
      # Only what the Psst pages splice; anything else would open empty PRs.
      - 'web/components/OutfitFont/**'
      - 'web/build/build-sites.mjs'
      - 'web/sites.json'
      - '.github/workflows/sync-psst.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  splice-psst:
    name: Splice into MindAttic.Psst (privacy.htm + terms.htm)
    runs-on: ubuntu-latest
    steps:
      # Side by side, so sites.json's ../../MindAttic.Psst targets resolve.
      - name: Checkout MindAttic.Components
        uses: actions/checkout@v4
        with:
          path: MindAttic.Components

      - name: Checkout MindAttic.Psst
        uses: actions/checkout@v4
        with:
          repository: mindattic/MindAttic.Psst
          path: MindAttic.Psst
          token: ${{ secrets.SUBSCRIBER_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Psst pages
        run: node MindAttic.Components/web/build/build-sites.mjs MindAttic.Psst

      - name: Open or update PR if there are changes
        uses: peter-evans/create-pull-request@v6
        with:
          path: MindAttic.Psst
          token: ${{ secrets.SUBSCRIBER_REPO_TOKEN }}
          commit-message: "chore(components): splice from MindAttic.Components@${{ github.sha }}"
          title: "Splice from MindAttic.Components"
          body: |
            Automated build from [MindAttic.Components@${{ github.sha }}](https://github.com/mindattic/MindAttic.Components/commit/${{ github.sha }}).

            The `MINDATTIC.COMPONENTS:OUTFITFONT` blocks in `privacy.htm` and `terms.htm` were regenerated by `web/build/build-sites.mjs`. Nothing outside the marker pairs changes.
          branch: auto/sync-components
          base: main
          delete-branch: true
          author: "MindAttic Components Bot <noreply@mindattic.com>"
          committer: "MindAttic Components Bot <noreply@mindattic.com>"
